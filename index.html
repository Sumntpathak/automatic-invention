<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Question For You ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Great+Vibes&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050208;
      color: #f4e9d8;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    /* ---- CSS Starfield (no canvas) ---- */
    .stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .stars::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 10px, #eee, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: twinkle 5s ease-in-out infinite;
      opacity: 0.6;
    }

    .stars::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 40px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 80px 20px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 10px 90px, #eee, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 150px 150px;
      animation: twinkle 7s ease-in-out infinite reverse;
      opacity: 0.4;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* ---- Background gradient ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(230,164,180,0.05), transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    /* ---- Container ---- */
    .container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ---- Progress Dots ---- */
    .progress {
      position: absolute;
      top: 3rem;
      display: flex;
      gap: 0.8rem;
      z-index: 10;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(212,175,122,0.3);
      transition: background 0.4s ease;
    }

    .dot.active {
      background: #d4af7a;
    }

    .dot.completed {
      background: #e6a4b4;
    }

    /* ---- Question Content ---- */
    .question-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      padding: 2rem;
    }

    .question-wrapper.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .question-content {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .question-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #e6a4b4;
      margin-bottom: 2rem;
      text-shadow: 0 0 30px rgba(230,164,180,0.3);
    }

    .question-subtitle {
      font-size: 1.1rem;
      color: #d4af7a;
      margin-bottom: 3rem;
      font-style: italic;
      letter-spacing: 0.1em;
    }

    /* ---- Buttons ---- */
    .button-group {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: transparent;
      border: 2px solid #d4af7a;
      color: #f4e9d8;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      padding: 0.9rem 2.2rem;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.4s ease;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      position: relative;
    }

    .btn:hover {
      background: #d4af7a;
      color: #050208;
      box-shadow: 0 0 25px rgba(212,175,122,0.4);
    }

    .btn-yes {
      border-color: #e6a4b4;
      color: #e6a4b4;
    }

    .btn-yes:hover {
      background: #e6a4b4;
      color: #050208;
      box-shadow: 0 0 25px rgba(230,164,180,0.4);
    }

    .btn-no {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ---- Input Field ---- */
    .input-group {
      margin-top: 2rem;
    }

    .input-group input {
      background: rgba(244,233,216,0.05);
      border: 1px solid rgba(212,175,122,0.3);
      color: #f4e9d8;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-size: 1.05rem;
      font-family: 'Cormorant Garamond', serif;
      width: 100%;
      max-width: 300px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: #e6a4b4;
      box-shadow: 0 0 15px rgba(230,164,180,0.2);
    }

    .input-group input::placeholder {
      color: rgba(244,233,216,0.4);
    }

    /* ---- Multiple Choice ---- */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .choice-btn {
      background: rgba(230,164,180,0.08);
      border: 1px solid rgba(212,175,122,0.2);
      color: #f4e9d8;
      padding: 0.8rem 2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 280px;
      text-align: center;
    }

    .choice-btn:hover {
      background: rgba(230,164,180,0.15);
      border-color: #e6a4b4;
      color: #e6a4b4;
    }

    /* ---- Tease Message ---- */
    .tease-message {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: #d4af7a;
      font-style: italic;
      font-size: 0.95rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 5;
    }

    .tease-message.show {
      opacity: 1;
    }

    /* ---- Completion Screen ---- */
    .completion {
      text-align: center;
    }

    .completion-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #e6a4b4;
      margin-bottom: 1rem;
      text-shadow: 0 0 40px rgba(230,164,180,0.4);
    }

    .completion-subtitle {
      font-size: 1.2rem;
      color: #d4af7a;
      margin-bottom: 2rem;
      letter-spacing: 0.15em;
    }

    .heart-burst {
      animation: burstHearts 2s ease-out forwards;
    }

    @keyframes burstHearts {
      0% {
        opacity: 1;
        transform: scale(0);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: scale(3) translateY(-100px);
      }
    }

    /* ---- Mobile ---- */
    @media (max-width: 600px) {
      .question-title {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        margin-bottom: 1.5rem;
      }

      .button-group {
        gap: 1rem;
      }

      .btn {
        padding: 0.7rem 1.5rem;
        font-size: 0.95rem;
      }

      .progress {
        top: 1.5rem;
        gap: 0.6rem;
      }

      .dot {
        width: 6px;
        height: 6px;
      }

      .question-subtitle {
        font-size: 0.9rem;
      }

      .tease-message {
        font-size: 0.85rem;
        bottom: 1rem;
      }
    }
  </style>
</head>
<body>

<div class="stars"></div>

<div class="container">
  <!-- Progress Dots -->
  <div class="progress">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <!-- Question 1 -->
  <div class="question-wrapper active" data-question="1">
    <div class="question-content">
      <h1 class="question-title">Do you love me?</h1>
      <div class="button-group">
        <button class="btn btn-yes" onclick="answerYes(1)">Yes</button>
        <button class="btn btn-no" id="no-btn-1" onmouseover="hideNo(1)" ontouchstart="hideNo(1)">No</button>
      </div>
    </div>
  </div>

  <!-- Question 2 -->
  <div class="question-wrapper" data-question="2">
    <div class="question-content">
      <h1 class="question-title">Are you sure?</h1>
      <p class="question-subtitle">Really, really sure?</p>
      <div class="button-group">
        <button class="btn btn-yes" onclick="answerYes(2)">Absolutely</button>
        <button class="btn btn-no" id="no-btn-2" onmouseover="hideNo(2)" ontouchstart="hideNo(2)">No</button>
      </div>
    </div>
  </div>

  <!-- Question 3 -->
  <div class="question-wrapper" data-question="3">
    <div class="question-content">
      <h1 class="question-title">How many years?</h1>
      <p class="question-subtitle">How long have we been together?</p>
      <div class="choices">
        <button class="choice-btn" onclick="checkAnswer(3, 6)">6 Years</button>
        <button class="choice-btn" onclick="checkAnswer(3, 5)">5 Years</button>
        <button class="choice-btn" onclick="checkAnswer(3, 7)">7 Years</button>
        <button class="choice-btn" onclick="checkAnswer(3, 4)">4 Years</button>
      </div>
    </div>
  </div>

  <!-- Question 4 -->
  <div class="question-wrapper" data-question="4">
    <div class="question-content">
      <h1 class="question-title">What best describes us?</h1>
      <p class="question-subtitle">Choose what feels right</p>
      <div class="choices">
        <button class="choice-btn" onclick="answerYes(4)">Soulmates</button>
        <button class="choice-btn" onclick="answerYes(4)">Partners</button>
        <button class="choice-btn" onclick="answerYes(4)">Forever</button>
        <button class="choice-btn" onclick="answerYes(4)">Destiny</button>
      </div>
    </div>
  </div>

  <!-- Question 5 -->
  <div class="question-wrapper" data-question="5">
    <div class="question-content">
      <h1 class="question-title">Final answer?</h1>
      <p class="question-subtitle">Type 'yes' below to enter...</p>
      <div class="input-group">
        <input type="text" id="final-input" placeholder="Type here..." onkeypress="handleFinalInput(event)">
      </div>
    </div>
  </div>

  <!-- Completion -->
  <div class="question-wrapper" data-question="complete">
    <div class="question-content completion">
      <h1 class="completion-title heart-burst">You Passed ♥</h1>
      <p class="completion-subtitle">Welcome to our story…</p>
    </div>
  </div>
</div>

<!-- Tease Message -->
<div class="tease-message" id="tease-msg"></div>

<script>
  const teaseMessages = [
    "Nice try! 😏",
    "You can't catch me 💨",
    "C'mon, I know the answer 💕",
    "Did you really think that would work? 😄",
    "The answer is 'yes', babe ♥",
    "Fine. I know. ♥"
  ];

  let currentQuestion = 1;
  let noAttempts = {};

  function showQuestion(num) {
    document.querySelectorAll('.question-wrapper').forEach(q => q.classList.remove('active'));
    const target = document.querySelector(`[data-question="${num}"]`);
    if (target) {
      target.classList.add('active');
      // Update progress dots
      document.querySelectorAll('.dot').forEach((dot, i) => {
        if (i + 1 < num) {
          dot.classList.add('completed');
          dot.classList.remove('active');
        } else if (i + 1 === num) {
          dot.classList.remove('completed');
          dot.classList.add('active');
        } else {
          dot.classList.remove('active', 'completed');
        }
      });
    }
    window.scrollTo(0, 0);
  }

  function answerYes(questionNum) {
    if (questionNum === currentQuestion) {
      currentQuestion++;
      if (currentQuestion > 5) {
        showCompletion();
      } else {
        showQuestion(currentQuestion);
      }
    }
  }

  function checkAnswer(questionNum, answer) {
    if (questionNum === currentQuestion) {
      if (answer === 6) {
        // Correct answer
        answerYes(questionNum);
      } else {
        // Wrong answer
        showTease("Try again 😏");
      }
    }
  }

  function handleFinalInput(event) {
    if (event.key === 'Enter') {
      const input = document.getElementById('final-input');
      if (input.value.toLowerCase() === 'yes') {
        answerYes(5);
      } else {
        showTease("Almost! Type 'yes' 💕");
        input.value = '';
      }
    }
  }

  function hideNo(questionNum) {
    const btn = document.getElementById(`no-btn-${questionNum}`);
    if (!noAttempts[questionNum]) {
      noAttempts[questionNum] = 0;
    }

    noAttempts[questionNum]++;

    const randomX = Math.random() * window.innerWidth;
    const randomY = Math.random() * window.innerHeight;

    btn.style.position = 'fixed';
    btn.style.left = randomX + 'px';
    btn.style.top = randomY + 'px';

    // Scale down by 10% each attempt (min 30%)
    const scale = Math.max(0.3, 1 - (noAttempts[questionNum] * 0.1));
    btn.style.transform = `scale(${scale})`;

    // Show tease message
    const msgIndex = Math.min(noAttempts[questionNum] - 1, teaseMessages.length - 1);
    showTease(teaseMessages[msgIndex]);

    // After 5 attempts, hide the button completely
    if (noAttempts[questionNum] >= 5) {
      btn.style.opacity = '0';
      btn.style.pointerEvents = 'none';
    }
  }

  function showTease(msg) {
    const teaseEl = document.getElementById('tease-msg');
    teaseEl.textContent = msg;
    teaseEl.classList.add('show');
    setTimeout(() => teaseEl.classList.remove('show'), 2500);
  }

  function showCompletion() {
    showQuestion('complete');
    setTimeout(() => {
      window.location.href = 'thethread.html';
    }, 3000);
  }

  // Initialize
  showQuestion(1);
</script>

</body>
</html>
